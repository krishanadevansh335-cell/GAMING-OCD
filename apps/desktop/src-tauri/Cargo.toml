[package]
name = "gaming-ocd-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "gaming_ocd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
gcc-core = { path = "../../../crates/gcc-core" }
gcc-library = { path = "../../../crates/gcc-library" }
gcc-routing = { path = "../../../crates/gcc-routing" }
gcc-game-mode = { path = "../../../crates/gcc-game-mode" }
gcc-telemetry = { path = "../../../crates/gcc-telemetry" }
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
