[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/gcc-core",
  "crates/gcc-database",
  "crates/gcc-library",
  "crates/gcc-launcher",
  "crates/gcc-compatibility",
  "crates/gcc-routing",
  "crates/gcc-telemetry",
  "crates/gcc-game-mode",
  "platform/windows",
  "platform/linux",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["GAMING-OCD Contributors"]
license = "MIT"
repository = "https://github.com/krishanadevansh335-cell/GAMING-OCD"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
anyhow = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
